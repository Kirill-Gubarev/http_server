<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Профиль пользователя - Wildmonkey.ru</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="icon" href="favicon2.ico" type="image/x-icon">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="favicon2.ico" alt="Логотип">
            <h1>Wildmonkey.ru</h1>
        </div>
        <nav id="user-menu">
            <a href="/"><i class="fas fa-sign-out-alt"></i> На главную</a>
        </nav>
    </header>
    <main>
        <div class="profile-container">
            <form id="login-form" class="form-container">
                <div class="profile-card">
                    <h2>Личный кабинет</h2>
                    <p><strong>Логин:</strong> <span id="login"></span></p>
                    <p><strong>Email:</strong> <span id="email"></span></p>
                    <p><strong>Имя:</strong> <span id="fullname"></span></p>
                    <p><strong>Баланс:</strong> <span id="balance"></span></p>
                    <button id="logout-btn">Выйти</button>
                </div>
            </form>
        </div>
    </main>
    <script defer src="profile.js"></script>
</body>
</html>
