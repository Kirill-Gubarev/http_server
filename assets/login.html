<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Вход / Регистрация</title>
    <link rel="stylesheet" href="styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.1/css/all.min.css">
</head>
<body>
    <header>
        <h1>Вход / Регистрация</h1>
        <nav id="user-menu">
            <a href="/"><i class="fas fa-home"></i> Главная</a>
        </nav>
    </header>
    <main>
        <div class="tabs">
            <button id="login-tab" class="active">Вход</button>
            <button id="register-tab">Регистрация</button>
        </div>

        <!-- Форма входа -->
        <form id="login-form" class="form-container">
            <div class="form-field">
                <label for="login">Логин:</label>
                <input type="text" id="login" required>
            </div>

            <div class="form-field">
                <label for="password">Пароль:</label>
                <input type="password" id="password" required>
            </div>

            <button type="submit">Войти</button>
        </form>

        <!-- Форма регистрации (изначально скрыта) -->
        <form id="register-form" class="form-container" style="display: none;">
            <div class="form-field">
                <label for="reg-login">Логин:</label>
                <input type="text" id="reg-login" required>
            </div>

            <div class="form-field">
                <label for="reg-password">Пароль:</label>
                <input type="password" id="reg-password" required>
            </div>

            <div class="form-field">
                <label for="reg-password-confirm">Повторите пароль:</label>
                <input type="password" id="reg-password-confirm" required>
            </div>

            <div class="form-field">
                <label for="reg-email">Email:</label>
                <input type="email" id="reg-email" required>
            </div>

            <div class="form-field">
                <label for="reg-fullname">Полное имя:</label>
                <input type="text" id="reg-fullname" required>
            </div>

            <button type="submit">Зарегистрироваться</button>
        </form>
    </main>
    <script defer src="login.js"></script>
</body>
</html>
